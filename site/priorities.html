/* ================= review: one page, three views, matching numbers, a side panel of questions =================

const LINKS = { ready: null, m: new Map() };

function linkOf(a, b) {

/* the "no link above / below" notes only where there is link data: Math and ELA, or any subject with suggested links on */
const tagsOn = (s) => LM !== "n" && (LM === "a" || s === "Math" || s === "ELA");
/* one standard against the choices of the grade just above and just below */
function vert(s, g, k) {

    const ps = picksOf(s, h); if (!ps.length) { out[dir] = { h, empty: true, none: true, hits: [] }; continue; }
    const hits = ps.map((q) => ({ q, l: linkOf(k, pk(q)) })).filter((x) => x.l); out[dir] = { h, hits, none: !hits.length }; }

/* numbers: standards linked across the grades shown share a number (one number per connected group) */
/* Threads (Tim, Nov 2026: the same numbers and colours in all three views): one numbering for the whole subject. Working
   from Grade 12 down, each chosen standard joins its closest connection in the nearest grade above (up to two grades up):
   the same standard first, then an official link, then a suggested one (when shown), the smaller thread on a tie. So a
   number follows one line of connected standards down the grades instead of merging into a few huge groups. */
const GCOL = ["#101846", "#00897B", "#7C4DFF", "#B8860B", "#8D6E63", "#3949AB", "#546E7A", "#8E24AA", "#827717", "#37474F"];
const gcol = (n) => GCOL[(n - 1) % GCOL.length];
function threadModel(s) {
  const byG = {}; GRADES.forEach((g) => { byG[g] = picksOf(s, g).map((p) => ({ g, k: pk(p), id: g + "|" + pk(p) })); });
  const grp = new Map(), size = new Map(), solid = new Set(), rank = (l) => (l.t === "same" ? 0 : l.t === "off" ? 1 : 2); let n = 0;
  for (const g of GRADES) for (const c of byG[g]) {

      for (const a of byG[up]) { const l = linkOf(c.k, a.k); if (!l) continue;
        if (!best || rank(l) < rank(best.l) || (rank(l) === rank(best.l) && size.get(grp.get(a.id)) < size.get(grp.get(best.a.id)))) best = { a, l }; }
    if (best) { const G = grp.get(best.a.id); grp.set(c.id, G); size.set(G, size.get(G) + 1); if (best.l.t !== "sug") { solid.add(c.id); solid.add(best.a.id); } }

const nbadge = (n, solid, small) => `<span class="nb${solid ? "" : " sug"}${small ? " sm" : ""}" style="--gc:${gcol(n)}" title="${solid ? `Thread ${n}: standards with this number connect across the grades` : `Thread ${n}: a suggested link, check it`}">${n}</span>`;
/* the links among the grades shown (for click to trace), and the subject's thread numbers */
function connModel(s, grades) {

/* By strand: a grade x strand grid, like the coverage map */
function strandGrid(s, g, r) {

  const chosenIn = (st, y) => libs[y].some((e) => e.s === st && isPicked(s, y, key(e)));

    let noUp = 0, noDn = 0; if (tagsOn(s)) ch.forEach((e) => { const v = vert(s, x, key(e)); if (v.up && !v.up.empty && v.up.none) noUp++; if (v.down && !v.down.empty && v.down.none) noDn++; });
    const i = K12.indexOf(x), gap = !ch.length && K12.slice(0, i).some((y) => chosenIn(st, y)) && K12.slice(i + 1).some((y) => chosenIn(st, y));

function reviewV(s, g, r) {

  const pickers = `<div class="row-acts colpick">${mode === "cols" ? [["a", "Left column", a], ["b", "Middle column", b], ["g", "Being reviewed", g]].map(([k, l, v]) => `<label class="cpick">${l}<select data-col="${k}">${k === "b" ? `<option value="-"${v === "-" ? " selected" : ""}>None</option>` : ""}${gopts(s, v)}</select></label>`).join("")
    : `<label class="cpick">Being reviewed<select data-col="g">${gopts(s, g)}</select></label>`}${help("pickers")}<span style="flex:1"></span>${links}</div>`;
  const legend = `<p class="legend">${LM === "n" ? "" : `<span>${nbadge(1, true, true)}${nbadge(2, true, true)}${nbadge(3, true, true)} Same number and colour: one line of connected standards across the grades${LM === "a" ? ` (dashed: suggested, check)` : ""}. ${mode === "strand" ? "Click a cell to see its standards." : "Click a standard to see how it connects."}</span>`}${mode === "prog" ? `<span><span class="dashbox"></span> Dashed card: not agreed yet</span>` : ""}</p>`;
  const note = LM === "o" && !["Math", "ELA"].includes(s) ? `<p class="cnote">${esc(s)} has no official links between grades, so only the same standard chosen in two grades gets a number. Choose <b>Official and suggested</b> to see possible links, and check them.</p>` : "";

/* ================= events ================= */
document.addEventListener("click", (ev) => {

  const pk = ev.target.closest("[data-pick]"); if (pk && !pk.disabled) { const e = findStd(r.s, pk.dataset.pick); if (e) setPick(r.s, r.g, e, !isPicked(r.s, r.g, key(e))); return; }
  const un = ev.target.closest("[data-undo]"); if (un) { const e = findStd(r.s, un.dataset.undo); if (e) setPick(r.s, r.g, e, un.dataset.on === "1", un.dataset.note || "", true); return; }
  if (ev.target.closest("[data-dlgclose]") || ev.target.id === "stdDlg") { $("#stdDlg").close(); return; }
  const dp = ev.target.closest("[data-dlgpick]"); if (dp) { const e = findStd(r.s, dp.dataset.dlgpick); if (e) { setPick(r.s, r.g, e, !isPicked(r.s, r.g, key(e))); openStd(r.s, r.g, key(e), true); } return; }
  const mo = ev.target.closest("[data-more]"); if (mo) { openStd(r.s, r.g, mo.dataset.more, true); return; }
  const ad = ev.target.closest("[data-add]"); if (ad) { const e = findStd(r.s, ad.dataset.add); if (e && !isPicked(r.s, r.g, key(e))) { setPick(r.s, r.g, e, true); toast(`${e.c} added to ${gname(r.g)}. Recent changes on its page can undo it.`); } return; }
  const sd = ev.target.closest("[data-std]"); if (sd) { openStd(r.s, sd.dataset.sg, sd.dataset.std, sd.dataset.tick === "1"); return; }
  const rm = ev.target.closest("[data-rmode]"); if (rm) { location.hash = href({ s: r.s, g: r.g || "12", v: "review", m: rm.dataset.rmode === "cols" ? "" : rm.dataset.rmode, a: r.a, b: r.b, band: r.band }); return; }
  const lm = ev.target.closest("[data-lm]"); if (lm) { LM = lm.dataset.lm; store.set("pd_links", LM); render(true); return; }
  const bd = ev.target.closest("[data-band]"); if (bd) { keepScroll = true; location.hash = href({ s: r.s, g: r.g, v: "review", m: "strand", band: bd.dataset.band }); return; }
  const ce = ev.target.closest("[data-cell]"); if (ce) { REV.cell = REV.cell === ce.dataset.cell ? null : ce.dataset.cell; render(true); const d = $("#celldet"); if (d) d.scrollIntoView({ block: "nearest" }); return; }
  const di = ev.target.closest("[data-dismiss]"); if (di) { const o = dismissedSet(); if (o.has(di.dataset.dismiss)) o.delete(di.dataset.dismiss); else o.add(di.dataset.dismiss); store.set("pd_dismiss", JSON.stringify([...o])); render(true); return; }
  if (ev.target.closest("[data-practicereset]")) { if (confirm("Start the practice version again? Your practice changes on this laptop will be cleared.")) { try { localStorage.removeItem(PKEY); } catch (e) { /* none */ } location.reload(); } return; }
  if (ev.target.closest("[data-flags]")) { REV.flagsOpen = !REV.flagsOpen; render(true); return; }
  if (ev.target.closest("[data-showoff]")) { REV.showOff = !REV.showOff; render(true); return; }
  const sgo = ev.target.closest("[data-strandgo]"); if (sgo) { const g2 = sgo.dataset.sg || r.g; chooseV.f = { k: r.s + g2, q: "", strand: sgo.dataset.strandgo, only: "" }; location.hash = href({ s: r.s, g: g2, v: "choose" }); return; }
  const ogo = ev.target.closest("[data-onlygo]"); if (ogo) { chooseV.f = { k: r.s + r.g, q: "", strand: "", only: ogo.dataset.onlygo }; location.hash = href({ s: r.s, g: r.g, v: "choose" }); return; }
  const tr = ev.target.closest("[data-trace]"); if (tr) { trace(REV.sel === tr.dataset.trace ? null : tr.dataset.trace); return; }
  if (REV.sel && ev.target.closest("#revbox")) { trace(null); return; }
  const dn = ev.target.closest("[data-dens]"); if (dn) { DENS = dn.dataset.dens; store.set("pd_text", DENS); render(true); return; }
  const o = ev.target.closest("[data-only]"); if (o) { chooseV.f.only = o.dataset.only; render(true); return; }
  const st = ev.target.closest("[data-status]"); if (st) { setStatus(r.s, r.g, st.dataset.status); return; }
  const ag = ev.target.closest("[data-agree]"); if (ag && !ag.disabled) { agree(r.s, r.g, ag.dataset.agree === "1"); return; }
  const xl = ev.target.closest("[data-excel]"); if (xl) { exportExcel(xl.dataset.excel || null); return; }
  if (ev.target.closest("[data-fs]")) { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => toast("Full screen is not allowed here. Try Open full page.")); return; }
  if (ev.target.closest("[data-saveprofile]")) { saveProfile(r.s); return; }
});
document.addEventListener("input", (ev) => { if (ev.target.id === "q") { chooseV.f.q = ev.target.value; clearTimeout(render.q); render.q = setTimeout(() => { const pos = ev.target.selectionStart; render(true); const i = $("#q"); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 200); } });
document.addEventListener("change", (ev) => {
  const r = route();
  if (ev.target.id === "strand") { chooseV.f.strand = ev.target.value; render(true); }
  const n = ev.target.closest("[data-note]"); if (n) { const e = findStd(r.s, n.dataset.note); if (e) setPick(r.s, r.g, e, true, n.value.trim()); }
  if (ev.target.matches("[data-lmsel]")) { LM = ev.target.value; store.set("pd_links", LM); ev.target.blur(); render(true); return; }
  const c = ev.target.closest("[data-col]"); if (c) { const val = (x) => { const el = $(`[data-col="${x}"]`); return el ? el.value : r[x]; }; const cur = { a: val("a"), b: val("b"), g: r.g }; cur[c.dataset.col] = c.value; c.blur(); keepScroll = true; location.hash = href({ s: r.s, g: cur.g, v: "review", m: r.m, a: cur.a, b: cur.b, band: r.band }); }
});
addEventListener("fullscreenchange", () => render(true));
document.addEventListener("keydown", (e) => { const tr = e.target.matches && e.target.matches("[data-trace]") ? e.target : null;
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); trace(REV.sel === tr.dataset.trace ? null : tr.dataset.trace); }
  else if (e.key === "Escape" && REV.sel && !$("#stdDlg").open) trace(null);
  if (e.key === "Escape") closeHelp(); });
addEventListener("keydown", (e) => { const r = route(); if (r.v !== "show" || e.target.closest("input, textarea, select") || e.repeat) return; const i = GRADES.indexOf(GRADES.includes(r.g) ? r.g : "12");
  const go = (j) => { if (j >= 0 && j < GRADES.length) { e.preventDefault(); location.hash = href({ s: r.s, v: "show", g: GRADES[j] }); } };
  if (["PageDown", "ArrowRight", "ArrowDown", " ", "n", "N"].includes(e.key)) go(i + 1); else if (["PageUp", "ArrowLeft", "ArrowUp", "p", "P"].includes(e.key)) go(i - 1); });
boot().catch((e) => { $("#app").innerHTML = `<p class="notice">The page could not load: ${esc(e.message)}</p>`; });
</script>
