<html lang="en">
<head>

<title>Vertical Alignment Learning Maps</title>

<style>
/* Part 2 (Tim, Nov 2026, new direction): each grade picks its focus standards (at least a quarter of its standards), sees them by strand to print or copy, then fills in the Learning Map. ("Focus standards", not
   "priority standards": the school already has Priority (6-12) and Power (K-5) standards.) Same look as the PD pages. */
:root {
  --navy: #101846; --navy-2: #3B4268; --muted: #5A6080; --line: #D5DAE3; --cta: #B5DF00; --cta-2: #A6CF00;
  --lime: #80BC00; --blue: #3099BE; --magenta: #CB0068; --amber: #ED9200;
  --deep: #78BE21; --intro: #0092BC; --not: #D00070;
  --glass: rgba(255,255,255,.66); --glass-b: rgba(255,255,255,.9);
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; } [hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--font); color: var(--navy); font-size: 17px; line-height: 1.45; min-height: 100vh;
  background: radial-gradient(55% 45% at 0% 0%, #D7CFF0 0%, transparent 70%), radial-gradient(50% 40% at 100% 10%, #BCD9EC 0%, transparent 70%), radial-gradient(55% 45% at 100% 100%, #CCE5DF 0%, transparent 72%), radial-gradient(55% 45% at 0% 95%, #F6EAD7 0%, transparent 72%), #F3F4F8; background-attachment: fixed; }
h1, h2, h3 { margin: 0; line-height: 1.08; letter-spacing: -.01em; font-weight: 800; text-wrap: balance; }
h1 { font-size: clamp(2rem, 4vw, 3.2rem); } h2 { font-size: clamp(1.4rem, 2.4vw, 1.9rem); } h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; } a { color: var(--navy); } button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px); }
body.wide .wrap { max-width: 1800px; }   /* Tim, Nov 2026: the choose and review pages use more of the screen */
header.top { position: sticky; top: 0; z-index: 20; background: rgba(243,244,248,.82); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(16,24,70,.08); }
header.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 64px; flex-wrap: wrap; }
.brand { font-weight: 800; text-decoration: none; line-height: 1.05; }
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 600; font-size: .95rem; }
.crumbs a { text-decoration: none; padding: 6px 8px; border-radius: 8px; } .crumbs a:hover { background: rgba(16,24,70,.06); } .crumbs span { color: var(--muted); }
.who { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: .9rem; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: .82rem; background: rgba(16,24,70,.07); white-space: nowrap; }
.pill.team { background: var(--navy); color: #fff; } .pill.practice { background: var(--amber); color: #fff; }
.st-draft { background: rgba(16,24,70,.07); } .st-ready { background: #DCEBF5; color: #0d4f6b; } .st-approved { background: var(--cta); color: var(--navy); }
.btn { border: 1.5px solid var(--navy); background: transparent; border-radius: 999px; padding: 9px 18px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; }
.btn:hover { background: rgba(16,24,70,.06); } .btn.cta { background: var(--cta); border-color: var(--cta); } .btn.cta:hover { background: var(--cta-2); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; } .btn[disabled] { opacity: .45; cursor: default; }
.row-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--glass); backdrop-filter: blur(8px) saturate(1.2); border: 1px solid var(--glass-b); border-radius: 22px; padding: clamp(16px, 2.4vw, 28px); box-shadow: 0 18px 40px -28px rgba(16,24,70,.35); }
main { padding: 26px 0 80px; } .stack > * + * { margin-top: 18px; }

.notice { padding: 12px 16px; border-radius: 14px; background: #FFF4E0; border-left: 5px solid var(--amber); font-weight: 600; }

.lrow .g { font-weight: 800; font-size: 1.1rem; } .lrow .g small { display: block; font-weight: 600; color: var(--muted); font-size: .85rem; }

.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }

.std { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.82); border: 1.5px solid transparent; }
.std.on { border-color: var(--lime); background: #F4FAE6; }
.tick { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--navy); background: #fff; cursor: pointer; font-weight: 800; font-size: 1.2rem; display: grid; place-items: center; }
.std.on .tick { background: var(--lime); border-color: var(--lime); color: #fff; } .tick[disabled] { opacity: .4; cursor: default; }
/* text size in the library (remembered on this laptop): short = two lines with Show all, line = one line per standard, full */
.sbody .shead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; } .sbody .shead .alt { display: inline; }
.more { border: 0; background: none; padding: 0; font-weight: 700; font-size: .82rem; text-decoration: underline; cursor: pointer; color: var(--navy-2); margin-top: 2px; }

.lib[data-d="short"] .std:not(.open) .stext, .plist[data-d="short"] .stext, .plist[data-d="line"] .stext { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lib[data-d="short"] .std, .lib[data-d="line"] .std { padding: 9px 12px; gap: 10px; grid-template-columns: 34px 1fr; }
.lib[data-d="short"] .tick, .lib[data-d="line"] .tick { width: 34px; height: 34px; font-size: 1rem; border-radius: 10px; }

.lib[data-d="line"] { gap: 3px; } .lib[data-d="line"] .std { align-items: center; border-radius: 10px; padding: 5px 10px; } .lib[data-d="line"] .std.open { align-items: start; padding: 10px 12px; }
.lib[data-d="line"] .std:not(.open) .sbody { display: grid; grid-template-columns: 118px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
.lib[data-d="line"] .std:not(.open) .alt { display: none; }
.lib[data-d="line"] .std:not(.open) .stext { margin: 0; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib[data-d="line"] .std:not(.open) .hints { margin: 0; flex-wrap: nowrap; }
.lib[data-d="line"] .std:not(.open) .h { font-size: 0; width: 14px; height: 14px; padding: 0; } .lib[data-d="line"] .std:not(.open) .h.pr { font-size: .8rem; width: auto; height: auto; background: none; }
.lib[data-d="line"] .std:not(.open) .h.pr .w { display: none; }
.dens { display: flex; gap: 6px; align-items: center; font-weight: 700; font-size: .88rem; margin-top: 8px; }
.code { font-weight: 800; } .alt { font-style: italic; color: var(--muted); font-size: .82rem; display: block; }
.stext { margin-top: 4px; color: var(--navy-2); font-size: .97rem; }

.h.pr { background: #FFE9C7; color: #8a4f00; }
.h.r2 { background: var(--deep); color: #fff; } .h.r1 { background: var(--intro); color: #fff; } .h.r0 { background: var(--not); color: #fff; }
.picks { position: sticky; top: 84px; }
.count { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 10px; } .count b { font-size: 2.2rem; line-height: 1; }

.undo { border: 1.5px solid var(--navy); background: #fff; border-radius: 999px; padding: 2px 10px; font-weight: 700; cursor: pointer; font-size: .8rem; }
.panel h2 + .lead { margin-top: 4px; }
/* K-5 grade page: four subject tabs; minimum and goal bar; Our focus standards by strand */
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.door h2 { margin-bottom: 6px; } .door .lead { font-size: 1rem; margin-bottom: 14px; }
.gbtns { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; } .gbtns.sec { grid-template-columns: repeat(7, 1fr); } .gbtns.sec .gbtn { border-top-color: var(--blue); }
.gbtn { display: grid; place-items: center; gap: 2px; padding: 16px 8px; border-radius: 16px; background: rgba(255,255,255,.85); text-decoration: none; font-weight: 800; font-size: 1.5rem; box-shadow: 0 8px 24px rgba(16,24,70,.08); border-top: 5px solid var(--lime); }
.gbtn small { font-size: .78rem; font-weight: 600; color: var(--muted); }
.subjects.two { grid-template-columns: 1fr 1fr; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { display: grid; gap: 2px; padding: 10px 16px; border-radius: 14px; background: rgba(255,255,255,.75); text-decoration: none; border-bottom: 4px solid var(--c); min-width: 150px; }
.tab b { font-size: 1.05rem; } .tab span { font-size: .82rem; color: var(--muted); }
.tab[aria-current="page"] { background: var(--navy); color: #fff; } .tab[aria-current="page"] span { color: #DDE2F0; }
.st-selected { background: var(--cta); color: var(--navy); }
.meter { position: relative; height: 12px; border-radius: 999px; background: rgba(16,24,70,.1); margin: 12px 0 4px; overflow: visible; }
.meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--amber); }
.meter.ok > i { background: var(--lime); }
.meter .mk { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--navy); }
.mlabels { position: relative; height: 18px; font-size: .75rem; font-weight: 700; color: var(--navy-2); }
.mlabels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.minnote { font-size: .9rem; color: var(--navy-2); margin-top: 6px; }
.minnote.gate { background: #FFF4E0; border: 1px solid var(--amber); border-radius: 10px; padding: 8px 12px; color: var(--navy); font-weight: 600; }
.gcards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

.ftext { margin-top: 6px; display: grid; gap: 6px; }
.ftext div { padding: 6px 0; border-bottom: 1px solid #E3E6EE; } .ftext b { margin-right: 8px; }

.ptable { overflow-x: auto; } .ptable table { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: .9rem; }

#msgText { width: 100%; font-family: inherit; font-size: .92rem; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }
.pshow { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 10px; }
.pgroup + .pgroup { margin-top: 10px; } .ph { display: flex; gap: 8px; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--navy); padding-bottom: 3px; margin-bottom: 6px; } .ph b { font-size: .95rem; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; } .pchip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 8px; background: #F1F5E6; border: 1px solid #DDE8C2; }
.pchip .code { cursor: pointer; } .pchip .cross { width: 22px; height: 22px; font-size: 1rem; }

.nextbox { padding: 14px 18px; border-radius: 16px; background: #F1F8DC; border: 2px solid var(--cta); display: grid; gap: 8px; } .nextbox b { font-size: 1.15rem; }
.copyb { border: 1.5px solid var(--navy); background: #fff; border-radius: 999px; padding: 3px 12px; font-weight: 700; cursor: pointer; font-size: .82rem; }
/* documents to print */
.doc { background: #fff; border-radius: 18px; padding: clamp(16px, 3vw, 36px); box-shadow: 0 18px 40px -28px rgba(16,24,70,.35); }
.doc h1 { font-size: 2rem; } .doc h2 { font-size: 1.35rem; margin-top: 22px; padding-top: 12px; border-top: 2px solid var(--navy); }

@media print {

/* Tim, 16 Nov 2026: once a subject's focus standards are selected, move on to the Vertical Alignment Learning Map */
const nextBox = (s, g) => statusOf(s, g) !== "selected" ? "" : `<div class="nextbox"><b>You are ready to move on to the Vertical Alignment Learning Map.${help("next")}</b><p>Open your Learning Map, then copy one strand at a time: press <b>Copy codes</b> beside a strand (on the right) and paste it into that strand's row. This is our first draft: we will keep working on it and polish it in the future.</p>
  <div class="row-acts">${mapLinks(s, g).replace('class="btn"', 'class="btn cta"')}<a class="btn small" href="${DRIVE_EXAMPLE}" target="_blank" rel="noopener">See an example ↗</a></div></div>`;
function chooseV(s, g) {
  const lib = library(s, g), picked = picksOf(s, g), st = statusOf(s, g), ed = canEdit(), min = minOf(s, g), n = picked.length;
  const f = chooseV.f = chooseV.f && chooseV.f.k === s + g ? chooseV.f : { k: s + g, q: "", strand: "", only: "" }; if (!chooseV.open || chooseV.openK !== s + g) { chooseV.open = new Set(); chooseV.openK = s + g; }
  const strands = [...new Set(lib.map((e) => e.s))];
  const rows = lib.filter((e) => (!f.q || (e.c + " " + e.t).toLowerCase().includes(f.q.toLowerCase())) && (!f.strand || e.s === f.strand) && (f.only !== "pr" || (e.pr || []).includes(g)) && (f.only !== "on" || isPicked(s, g, key(e))));
  let last = ""; const items = rows.map((e) => { const k = key(e), on = isPicked(s, g, k), lv = D.ratings.get(`${e.f}|${e.c}|${g}`), pm = prMark(e, g); const sh = e.s !== last ? `<p class="strandh">${esc(e.s)}</p>` : ""; last = e.s;
    const op = chooseV.open.has(k);
    return `${sh}<div class="std${on ? " on" : ""}${op ? " open" : ""}"><button class="tick" type="button" data-pick="${esc(k)}" aria-pressed="${on}" aria-label="${on ? "Remove" : "Add"} ${esc(e.c)}"${ed ? "" : " disabled"}>${on ? "&#10003;" : "+"}</button><div class="sbody"><span class="shead">${fw(e)}</span><p class="stext" data-more="${esc(k)}">${esc(e.t)}</p><div class="hints">${lv != null ? `<span class="h ${RATING[lv][0]}" title="${RATING[lv][1]}">${RATING[lv][1]}</span>` : ""}${pm ? `<span class="h pr" title="School ${pm.toLowerCase()} standard">&#9733;<span class="w"> School ${pm.toLowerCase()} standard</span></span>` : ""}</div><button class="more" type="button" data-more="${esc(k)}" aria-haspopup="dialog">Show all</button></div></div>`; }).join("");
  /* Tim, 16 Nov 2026: a numbered list of what is chosen, in the order of the standards; a cross takes one off */
  /* Tim, 17 Nov 2026: the chosen standards grouped by strand, right here: Show Codes / Short text / Full text, Copy codes per
     strand and for the subject, and a cross on each to take it off (no second screen needed) */
  let num = 0; const G = groups(s, g);
  const cross = (e) => (ed ? `<button class="cross" type="button" data-pick="${esc(key(e))}" aria-label="Take off ${esc(e.c)}" title="Take off">&times;</button>` : "");
  const plist = G.length ? G.map(([strand, list]) => `<div class="pgroup"><div class="ph"><b>${esc(strand)} <span class="saved">(${list.length})</span></b><button class="copyb" type="button" data-copy="${esc(codesLine(list))}">Copy codes</button></div>
    ${FMODE === "codes" ? `<div class="pchips">${list.map((e) => `<span class="pchip"><span class="code" data-more="${esc(key(e))}" title="${esc(e.t)}">${esc(e.c)}</span>${cross(e)}</span>`).join("")}</div>`
      : `<ol class="olist" start="${num + 1}">${list.map((e) => { num++; return `<li><span class="body"><span class="code">${esc(e.c)}</span><span class="stext${FMODE === "full" ? " full" : ""}" data-more="${esc(key(e))}">${esc(e.t)}</span></span>${cross(e)}</li>`; }).join("")}</ol>`}</div>`).join("") : "";
  const showBar = `<div class="pshow"><span class="dens" role="group" aria-label="What to show" style="margin:0">Show:${[["codes", "Codes"], ["short", "Short text"], ["full", "Full text"]].map(([k, l]) => `<button class="chip" type="button" data-fmode="${k}" aria-pressed="${FMODE === k}">${l}</button>`).join("")}</span>${G.length ? `<button class="btn small" type="button" data-copy="${esc(allCodes(s, g))}">Copy all codes</button>` : ""}</div>`;
  const minMsg = `Please pick more. Every subject needs at least a quarter of its standards as focus standards: at least ${min} of ${lib.length} here (you have ${n}).`;
  const fhref = href({ g, s, v: "focus" });
  return `<div class="stack"><div class="panel stack"><h1>${course(s, g) ? `${gname(g)} · ${esc(course(s, g))}` : gname(g)} ${esc(s)}</h1><p class="lead">Which of these standards must every class teach in depth? Choose all the standards that need to be taught in depth to succeed in this subject.</p>${subjTabs(g, s)}${nextBox(s, g) || `<div class="row-acts">${mapLinks(s, g, true)}</div>`}</div>
    <div class="choose"><section class="panel" aria-label="Library"><h2>Our standards${help("library")}</h2>
      <div class="tools"><input type="search" id="q" placeholder="Search by code or words" value="${esc(f.q)}" aria-label="Search the standards"><select id="strand" aria-label="Strand"><option value="">All strands</option>${strands.map((x) => `<option${x === f.strand ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div class="chips" role="group" aria-label="Show">${[["", "All"], ["on", "Chosen"], ["pr", `★ School ${isK5(g) ? "power" : "priority"} standards`]].map(([k, t]) => `<button class="chip" type="button" data-only="${k}" aria-pressed="${f.only === k}">${t}</button>`).join("")}</div>
      <div class="dens" role="group" aria-label="How much of each standard to show">Text:${[["short", "Short"], ["line", "One line"], ["full", "Full"]].map(([k, t]) => `<button class="chip" type="button" data-dens="${k}" aria-pressed="${DENS === k}">${t}</button>`).join("")}</div>
      <p class="saved" style="margin:10px 0">${rows.length} of ${lib.length} standards shown</p><div class="lib" data-d="${DENS}">${items || `<p class="empty">No standards match.</p>`}</div></section>
    <aside class="panel picks" aria-label="Our focus standards"><h2>Our focus standards${help("picks")}</h2>
      <div class="count"><b>${n}</b><span>of ${lib.length} chosen</span>${stPill(st)}</div>
      ${GATE[s + "|" + g] && n < min ? `<p class="minnote gate" role="alert">${minMsg}</p>` : ""}
      ${showBar}<div class="plist">${plist || `<p class="empty">Tick standards in the list on the left to add them here.</p>`}</div>
      <div class="row-acts">${ed && st === "draft" ? `<button class="btn cta" type="button" data-status="ready"${n > 0 ? "" : " disabled"}>We selected our focus standards</button>` : ""}${ed && st === "selected" ? `<button class="btn small" type="button" data-status="draft">Back to draft</button>` : ""}<a class="btn" href="${fhref}">Print our focus standards</a><a class="btn small" href="${href({ s, g, v: "paper" })}">Print the full list (paper)</a></div>
</aside></div></div>`;
}

/* Progress and messages (Tim, 16 Nov 2026): every grade and subject's status with its links, and a message maker that
   writes the email (or chat) text with the right links, to copy or open in an email */
const SITE_URL = "https://awsaj-curriculum.github.io/awsaj-vertical-alignment/priorities.html";
const MSG = { g: "", kind: "start" };
const subjLabel = (s, g) => `${gname(g)} ${s}${course(s, g) ? ` (${course(s, g)})` : ""}`;
function buildMsg(g, kind) {
  const grades = g ? [g] : ALLG, out = [];
  const head = { start: "Dear colleagues,\n\nPlease choose your focus standards for each of your subjects: all the standards that need to be taught in depth to succeed in the subject. Then press We selected our focus standards.",
    remind: "Dear colleagues,\n\nA friendly reminder: these lists still need their focus standards: all the standards that need to be taught in depth to succeed in the subject.",
    map: "Dear colleagues,\n\nThank you for selecting your focus standards. You are ready to move on to the Vertical Alignment Learning Map: open your Learning Map and copy one strand at a time: Copy codes beside each strand on the site, then paste into that strand's row." }[kind];
  out.push(head, "");
  grades.forEach((x) => {
    const subs = SUBJ.map(([s]) => s).filter((s) => kind === "start" || (kind === "remind" ? statusOf(s, x) !== "selected" : statusOf(s, x) === "selected"));
    if (!subs.length) return;
    out.push(`${gname(x)}: ${SITE_URL}#g=${x}`);
    subs.forEach((s) => {
      const n = picksOf(s, x).length, min = minOf(s, x);
      if (kind === "remind") out.push(`  ${subjLabel(s, x)}: ${n} chosen so far. ${SITE_URL}#g=${x}&s=${encodeURIComponent(s)}&v=choose`);
      else if (kind === "map") out.push(`  ${subjLabel(s, x)} Learning Map: ${mapDoc(s, x)}`);
      else out.push(`  ${subjLabel(s, x)}: ${SITE_URL}#g=${x}&s=${encodeURIComponent(s)}&v=choose`);
    });
    out.push("");
  });
  if (out.length <= 2) out.push(kind === "remind" ? "Every list here has its focus standards selected. Thank you!" : "No list here has its focus standards selected yet.", "");
  out.push(kind === "map" ? "All the Learning Maps are in the shared Drive folder Awsaj Learning Maps: " + DRIVE_ROOT : "Step-by-step help: " + SITE_URL.replace("priorities.html", "") + (g && !isK5(g) ? HELP_PDF.ms : HELP_PDF.k5), "", "Thank you.");
  return out.join("\n");
}
const MSG_SUBJECT = { start: "Please choose your focus standards", remind: "Reminder: focus standards still to choose", map: "Next step: your Vertical Alignment Learning Map" };
function progressV() {
  const lists = ALLG.length * SUBJ.length, done = ALLG.reduce((a, g) => a + SUBJ.filter(([s]) => statusOf(s, g) === "selected").length, 0);
  const rows = ALLG.map((g) => `<tr><th><a href="${href({ g })}">${esc(gname(g))}</a></th>${SUBJ.map(([s]) => { const n = picksOf(s, g).length, min = minOf(s, g), st = statusOf(s, g);
    return `<td class="pc ${st}"><a href="${chooseHref(s, g)}" title="${esc(subjLabel(s, g))}">${st === "selected" ? "&#10003; Selected" : n ? `Draft, ${n} chosen` : "Not started"}</a><a class="docl" href="${mapDoc(s, g)}" target="_blank" rel="noopener">Learning Map ↗</a></td>`; }).join("")}</tr>`).join("");
  const text = buildMsg(MSG.g, MSG.kind), mail = `mailto:?subject=${encodeURIComponent(MSG_SUBJECT[MSG.kind])}&body=${encodeURIComponent(text)}`;
  return `<div class="stack"><div class="panel stack"><h1>Progress and messages${help("progress")}</h1><p class="lead">${done} of ${lists} lists have selected their focus standards. Click a cell to open that list.</p>
    <div class="ptable"><table><thead><tr><th>Grade</th>${SUBJ.map(([s]) => `<th>${s}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="saved">Learning Map opens each grade and subject's Google Doc in the shared folder <a href="${DRIVE_ROOT}" target="_blank" rel="noopener">Awsaj Learning Maps ↗</a>. The site cannot see inside the documents, so it cannot tell whether a Learning Map is filled in.</p></div>
    <div class="panel stack"><h2>Write a message${help("message")}</h2>
      <div class="tools"><select id="msgG" aria-label="Grade"><option value="">All grades</option>${ALLG.map((g) => `<option value="${g}"${MSG.g === g ? " selected" : ""}>${esc(gname(g))}</option>`).join("")}</select>
        <span class="chips" role="group" aria-label="Message">${[["start", "Choose your focus standards"], ["remind", "Reminder: still to choose"], ["map", "Next step: your Learning Map"]].map(([k, l]) => `<button class="chip" type="button" data-msgk="${k}" aria-pressed="${MSG.kind === k}">${l}</button>`).join("")}</span></div>
      <p class="saved">Subject: <b>${esc(MSG_SUBJECT[MSG.kind])}</b></p>
      <textarea id="msgText" rows="14" readonly>${esc(text)}</textarea>
      <div class="row-acts"><button class="btn cta" type="button" data-copy="${esc(text)}">Copy the message</button>${mail.length < 1900 ? `<a class="btn" href="${mail}">Open in email</a>` : `<span class="saved">This message is long: use Copy and paste it into your email or chat.</span>`}</div></div></div>`;
}

/* Our focus standards by strand: codes only (default), short or full text; print and copy */
function focusOne(s, g) {
  const G = groups(s, g), n = picksOf(s, g).length, st = statusOf(s, g);
  const short = (t) => (t.length > 140 ? t.slice(0, 137).replace(/\s+\S*$/, "") + "…" : t);
  const body = G.length ? `<div class="fgroups">${G.map(([strand, list]) => `<div class="fgroup"><h3><span>${esc(strand)} <span class="saved">(${list.length})</span></span><button class="copyb" type="button" data-copy="${esc(codesLine(list))}">Copy codes</button></h3>
      ${FMODE === "codes" ? `<div class="codes">${list.map((e) => `<span>${esc(e.c)}</span>`).join("")}</div>` : `<div class="ftext">${list.map((e) => { const p = picksOf(s, g).find((x) => `${x.framework}|${x.code}` === key(e)) || {}; return `<div><b>${esc(e.c)}</b>${esc(FMODE === "short" ? short(e.t || "") : e.t)}${p.note ? ` <i class="saved">(${esc(p.note)})</i>` : ""}</div>`; }).join("")}</div>`}</div>`).join("")}</div>` : `<p class="empty">No focus standards chosen yet.</p>`;
  return `<section class="fsub"><h2>${esc(gtext(s, g))} ${esc(s)}</h2><p class="sub">${n} focus standards of ${library(s, g).length} · ${STATUS[st]}</p>
    ${nextBox(s, g).replace('class="nextbox"', 'class="nextbox noprint"')}<div class="row-acts noprint" style="margin-top:8px">${G.length ? `<button class="btn small" type="button" data-copy="${esc(allCodes(s, g))}">Copy all codes (${esc(s)})</button>` : ""}<a class="btn small" href="${chooseHref(s, g)}">Change the list</a></div>${body}</section>`;
}
function focusV(subs, g) {
  const today = new Date().toLocaleDateString([], { day: "numeric", month: "long", year: "numeric" }), one = subs.length === 1;
  const back = one ? chooseHref(subs[0], g) : href({ g });
  return `<div class="stack"><div class="row-acts noprint"><button class="btn cta" type="button" onclick="print()">Print</button><a class="btn" href="${back}">Back</a>
      <span class="dens" role="group" aria-label="What to show" style="margin:0 0 0 8px">Show:${[["codes", "Codes only"], ["short", "Codes and short text"], ["full", "Codes and full text"]].map(([k, t]) => `<button class="chip" type="button" data-fmode="${k}" aria-pressed="${FMODE === k}">${t}</button>`).join("")}</span>${help("focus")}</div>
    <article class="doc"><h1>Our focus standards: ${one ? esc(gtext(subs[0], g)) + " " + esc(subs[0]) : esc(gname(g))}</h1><p class="sub">Grouped by strand. ${today}.</p>
    ${subs.map((s) => focusOne(s, g)).join("")}</article></div>`;
}

/* paper: every standard one grade or course can choose from, with tick boxes and note lines */
function paperV(s, g) {
  const lib = library(s, g);
  let last = ""; const rows = lib.map((e) => { const lv = D.ratings.get(`${e.f}|${e.c}|${g}`), pm = prMark(e, g), sh = e.s !== last ? `<tr><td colspan="3" style="font-weight:800;background:#F3F4F8">${esc(e.s)}</td></tr>` : ""; last = e.s;
    return `${sh}<tr><td style="width:34px"><span class="box"></span></td><td style="width:24%">${fw(e)}${lv != null ? `<span class="alt">Part 1: ${RWORD[lv]}</span>` : ""}${pm ? `<span class="alt">&#9733; School ${pm.toLowerCase()} standard</span>` : ""}</td><td>${esc(e.t)}<div class="noteline"></div></td></tr>`; }).join("");
  return `<div class="stack"><div class="row-acts noprint"><button class="btn cta" type="button" onclick="print()">Print</button><a class="btn" href="${chooseHref(s, g)}">Back</a>${help("paper")}</div>
    <article class="doc"><h1>Focus standards: ${esc(gtext(s, g))} ${esc(s)}</h1><p class="sub">Tick the standards every class must teach in depth (${lib.length} to choose from).</p>
    <div class="fill"><span>Team</span><span>Date</span></div>
    <table><thead><tr><th></th><th>Standard</th><th>What students learn, and a note</th></tr></thead><tbody>${rows}</tbody></table></article></div>`;
}

/* the whole standard in a popup: full text, its Part 1 rating, the school's mark, and Add / Remove */
function openStd(s, g, k) {
  const e = findStd(s, k); if (!e) return; const lv = D.ratings.get(`${e.f}|${e.c}|${g}`), pm = prMark(e, g), on = isPicked(s, g, k), p = picksOf(s, g).find((x) => `${x.framework}|${x.code}` === k);
  $("#sdBody").innerHTML = `<p class="strandl">${esc(gtext(s, g))} ${esc(s)} · ${esc(e.s || "")}</p><h3 id="sdCode" style="margin-top:6px;font-size:1.4rem">${esc(e.c)}</h3><span class="alt">${esc(ccss(e))}</span>
    <p class="sdtext">${esc(e.t)}</p><div class="hints">${lv != null ? `<span class="h ${RATING[lv][0]}">${RATING[lv][1]}</span>` : `<span class="h">Not rated in Part 1</span>`}${pm ? `<span class="h pr">&#9733; School ${pm.toLowerCase()} standard</span>` : ""}${on ? `<span class="h st-selected">Chosen as a focus standard</span>` : ""}</div>
    ${p && p.note ? `<p class="saved" style="margin-top:10px"><b>Note:</b> ${esc(p.note)}</p>` : ""}
    <div class="row-acts" style="justify-content:flex-end;margin-top:18px">${canEdit() ? `<button class="btn ${on ? "" : "cta"}" type="button" data-dlgpick="${esc(k)}">${on ? "Remove from our focus standards" : "Add to our focus standards"}</button>` : ""}<button class="btn" type="button" data-dlgclose="1">Close</button></div>`;
  const d = $("#stdDlg"); if (!d.open) d.showModal();
}

/* ================= events ================= */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-help]"); if (t) { const b = t.nextElementSibling; closeHelp(b); b.hidden = !b.hidden; t.setAttribute("aria-expanded", !b.hidden);
    if (!b.hidden) { b.classList.remove("rt"); const r0 = b.getBoundingClientRect(); if (r0.right > innerWidth - 12) b.classList.add("rt"); } return; }
  if (!ev.target.closest(".helpbox")) closeHelp();
  const r = route();
  const pk = ev.target.closest("[data-pick]"); if (pk && !pk.disabled) { const e = findStd(r.s, pk.dataset.pick); if (e) setPick(r.s, r.g, e, !isPicked(r.s, r.g, key(e))); return; }
  const un = ev.target.closest("[data-undo]"); if (un) { const e = findStd(r.s, un.dataset.undo); if (e) setPick(r.s, r.g, e, un.dataset.on === "1", un.dataset.note || "", true); return; }
  if (ev.target.closest("[data-dlgclose]") || ev.target.id === "stdDlg") { $("#stdDlg").close(); return; }
  const dp = ev.target.closest("[data-dlgpick]"); if (dp) { const e = findStd(r.s, dp.dataset.dlgpick); if (e) { setPick(r.s, r.g, e, !isPicked(r.s, r.g, key(e))); openStd(r.s, r.g, key(e)); } return; }
  const mo = ev.target.closest("[data-more]"); if (mo) { openStd(r.s, r.g, mo.dataset.more); return; }
  const cp = ev.target.closest("[data-copy]"); if (cp) { copyText(cp.dataset.copy); return; }
  const mk = ev.target.closest("[data-msgk]"); if (mk) { MSG.kind = mk.dataset.msgk; render(true); return; }
  const fm = ev.target.closest("[data-fmode]"); if (fm) { FMODE = fm.dataset.fmode; store.set("pd_fmode", FMODE); render(true); return; }
  const dn = ev.target.closest("[data-dens]"); if (dn) { DENS = dn.dataset.dens; store.set("pd_text", DENS); render(true); return; }
  const o = ev.target.closest("[data-only]"); if (o) { chooseV.f.only = o.dataset.only; render(true); return; }
  const st = ev.target.closest("[data-status]"); if (st && !st.disabled) { if (st.dataset.status === "ready" && picksOf(r.s, r.g).length < minOf(r.s, r.g)) { GATE[r.s + "|" + r.g] = 1; render(false); return; } setStatus(r.s, r.g, st.dataset.status); return; }
  const xl = ev.target.closest("[data-excel]"); if (xl) { exportExcel(xl.dataset.excel || null); return; }
});
document.addEventListener("input", (ev) => { if (ev.target.id === "q") { chooseV.f.q = ev.target.value; clearTimeout(render.q); render.q = setTimeout(() => { const pos = ev.target.selectionStart; render(true); const i = $("#q"); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 200); } });
document.addEventListener("change", (ev) => {
  const r = route();
  if (ev.target.id === "strand") { chooseV.f.strand = ev.target.value; render(true); }
  if (ev.target.id === "msgG") { MSG.g = ev.target.value; render(true); }
  const n = ev.target.closest("[data-note]"); if (n) { const e = findStd(r.s, n.dataset.note); if (e) setPick(r.s, r.g, e, true, n.value.trim()); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeHelp(); });
boot().catch((e) => { $("#app").innerHTML = `<p class="notice">The page could not load: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
