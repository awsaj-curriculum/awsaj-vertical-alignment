<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PD walk-through</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* A guided walk-through of the whole PD (Tim, Nov 2026): the real pages on the left, a dark explanation panel on the right.
   Part 1 shows the all-staff slides; Part 2 shows the depth standards page in practice mode with a small made-up example.
   Nothing is saved. Next / Back work with a presentation clicker (Page Down, Right, Space, Enter = next; Page Up, Left = back). */
:root { --navy: #101846; --cta: #B5DF00; --amber: #ED9200; --font: "Barlow", system-ui, sans-serif; --panel: 400px; }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; } body { font-family: var(--font); color: #fff; background: #0b1033; overflow: hidden; }
.stage { position: fixed; left: 0; top: 0; bottom: 0; right: var(--panel); background: #F3F4F8; overflow: hidden; }
.stage iframe { position: absolute; left: 0; top: 0; border: 0; width: 1440px; height: 900px; transform-origin: 0 0; background: #F3F4F8; }
.panel { position: fixed; right: 0; top: 0; bottom: 0; width: var(--panel); background: #0b1033; padding: 26px 26px 20px; display: flex; flex-direction: column; gap: 14px; }
.part { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cta); }
h1 { margin: 0; font-size: 1.7rem; line-height: 1.1; font-weight: 800; } .txt { font-size: 1.05rem; line-height: 1.5; color: #E7E9F3; } .txt p { margin: 0 0 10px; } .txt b { color: #fff; }
.prog { height: 6px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; } .prog i { display: block; height: 100%; background: var(--cta); }
.count { font-size: .9rem; color: #B9BED6; } .sp { flex: 1; }
.nav { display: flex; gap: 10px; } .btn { flex: 1; border: 1.5px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
.btn.cta { background: var(--cta); border-color: var(--cta); color: var(--navy); } .btn[disabled] { opacity: .35; cursor: default; }
.home { color: #B9BED6; font-size: .9rem; } :focus-visible { outline: 3px solid var(--cta); outline-offset: 3px; }
@media (max-width: 860px) { :root { --panel: 100%; } .stage { right: 0; bottom: 46vh; } .panel { top: auto; height: 46vh; width: 100%; } }
</style>
</head>
<body>
<div class="stage" id="stage"><iframe id="frame" title="The page being explained" src="about:blank"></iframe></div>
<aside class="panel" aria-live="polite"><span class="part" id="part"></span><h1 id="title"></h1><div class="txt" id="txt"></div><div class="sp"></div>
  <div class="prog"><i id="bar"></i></div><span class="count" id="count"></span>
  <div class="nav"><button class="btn" id="back" type="button">Back</button><button class="btn cta" id="next" type="button">Next</button></div>
  <a class="home" href="./">Leave the walk-through</a><a class="home" id="full" href="pd-tour.html" target="_blank" rel="noopener" hidden>Open full page ↗</a></aside>
<script>
"use strict";
const PRIO = "priorities.html?practice=1&sample=1&tour=1";
const STEPS = [
  { part: "Welcome", title: "From Standards to Student Success", page: "journey", slide: 0, text: "<p>This walk-through shows the whole PD in two parts.</p><p><b>Part 1</b> is a short all-staff session on these slides. <b>Part 2</b> is the subject sessions, where teams choose their depth standards from Grade 12 down.</p><p>Use Next and Back, or a clicker. Nothing here is saved.</p>" },
  { part: "Part 1 · All-staff session", title: "Thank you", page: "journey", slide: "pd-thanks", text: "<p>We start by thanking staff: every team rated every standard it was asked about.</p><p>On the day, each number appears with a click. The navy line at the bottom is the bridge to the next slide.</p>" },
  { part: "Part 1 · All-staff session", title: "Why we are doing this", page: "journey", slide: "pd-why", text: "<p>The road from Kindergarten to Grade 12 ends at an Awsaj Graduate in the SAT / US Diploma track.</p><p>Every standard we teach is a step on this road. This PD focuses on that track.</p>" },
  { part: "Part 1 · Our data", title: "We rated in a similar pattern", page: "journey", slide: "pd-pattern", text: "<p>One chart: the three schools rated in a similar way. About a fifth to a quarter of standards are taught in depth.</p><p>The bridge asks the real question: do those standards line up across grades and schools?</p>" },
  { part: "Part 1 · Our data", title: "3 facts", page: "journey", slide: "pd-facts", text: "<p>Three facts: where we go deepest, how broad our teaching is, and the progressions with gaps.</p><p><b>This is no one's fault, but we have work to do.</b></p>" },
  { part: "Part 1 · Our data", title: "3 things to ponder", page: "journey", slide: "pd-ponder", text: "<p>Three questions that lead to today's work: what a graduate needs, which standards to take to depth, and whether each grade prepares students for the next.</p>" },
  { part: "Part 1 · Our data", title: "It is all on our site", page: "journey", slide: "pd-explore", text: "<p>Staff can scan the code to explore every standard and rating on the Vertical Alignment site.</p>" },
  { part: "Part 1 · What is a standard?", title: "What is a standard?", page: "journey", slide: "pd-standard", text: "<p>Today's work starts with our standards. A standard says what students should know and be able to do by the end of a grade or course.</p><p>Standard, lesson objective, instruction and assessment appear one at a time.</p>" },
  { part: "Part 1 · What is a standard?", title: "Breaking down a standard", page: "journey", slide: "pd-unpack", text: "<p>One Grade 12 standard, RI.11-12.10, broken into knowledge, skills, vocabulary and evidence of learning.</p><p>This is the thinking each team uses with its own standards.</p>" },
  { part: "Part 1 · Today's work", title: "Today's work", page: "journey", slide: "pd-goal", text: "<p>The staircase: we start at Grade 12 and work down. Each team chooses the standards it wants taught in depth.</p><p>We probably will not finish today, and that is expected.</p>" },
  { part: "Part 1 · Today's work", title: "Go to your subject groups", page: "journey", slide: "pd-go", text: "<p>Each subject group opens its subject from this slide. That takes them straight into Part 2.</p>" },
  { part: "Part 2 · Subject sessions", title: "Our depth standards", page: "prio", hash: "", text: "<p>Part 2 opens here. We call them <b>depth standards</b>: the school already has Priority (6-12) and Power (K-5) standards.</p><p>The steps are simple: choose, review, agree. From here on the page is in <b>practice mode</b> with a made-up Math example.</p>" },
  { part: "Part 2 · Subject sessions", title: "One subject, Grade 12 down", page: "prio", hash: "s=Math", ring: ".ladderlist", text: "<p>Every grade or course for the subject, from Grade 12 down, with its status: <b>Draft</b>, <b>Ready for the group</b> or <b>Agreed by the group</b>.</p><p>Anyone can open any grade at any time and work on its list together.</p>" },
  { part: "Part 2 · Choose", title: "What to expect", page: "prio", hash: "s=Math&g=10&v=choose", ring: ".expect", text: "<p>Every grade and course page starts with a short note on what to expect.</p><p>Geometry, for example, starts new strands, so few of its standards link to Algebra 2. We do not force connections that are not there.</p>" },
  { part: "Part 2 · Choose", title: "The library", page: "prio", hash: "s=Math&g=12&v=choose", ring: ".lib", text: "<p>All the grade-level standards this grade or course rated in Part 1. Search, filter by strand, and tick a standard to add it.</p><p>Hints help: the Part 1 rating, and a star when the school already names it a Priority or Power standard.</p>" },
  { part: "Part 2 · Choose", title: "Our depth standards", page: "prio", hash: "s=Math&g=12&v=choose", ring: ".plist", text: "<p>The chosen standards, with an optional note on why each is essential. There is no target number.</p><p>When the team has finished, it marks the list <b>ready for the group</b>. <b>Print this list</b> gives a paper copy with tick boxes.</p>" },
  { part: "Part 2 · Choose", title: "Recent changes and Undo", page: "prio", hash: "s=Math&g=11&v=choose", ring: ".changes", text: "<p>Every change from every laptop, newest first. If someone removes a standard by mistake, anyone can press <b>Undo</b>.</p>" },
  { part: "Part 2 · Learner profile", title: "The Awsaj Graduate", page: "prio", hash: "s=Math&v=profile", ring: ".pform", text: "<p>Once Grade 12 has chosen its standards, the learner profile opens: essential knowledge, essential skills, and application and independence for the subject.</p><p>Teams can change it as the work goes on.</p>" },
  { part: "Part 2 · Review", title: "Three lists side by side", page: "prio", hash: "s=Math&g=11&v=review", ring: ".rcols", text: "<p>Grade 12 with the learner profile, the grade above, and the grade being reviewed (outlined). Any column can show any grade.</p><p>There are no automatic lines: the group decides the connections. A tag marks the same standard chosen in two grades.</p>" },
  { part: "Part 2 · Review", title: "Agreed as a group", page: "prio", hash: "s=Math&g=11&v=review", ring: ".qs", text: "<p>Three questions guide the talk. Some standards will have no partner in the grade above, and that is expected.</p><p>When the group agrees on the set, the leader presses <b>Agreed as a group</b> and enters the PIN. The list is then locked.</p>" },
  { part: "Part 2 · Results", title: "The whole progression", page: "prio", hash: "s=Math&v=progression", ring: ".row-acts", text: "<p>Every grade's depth standards, from Grade 12 down. Dashed cards are lists not yet agreed.</p><p>From here: <b>Print our depth standards</b>, <b>Show on screen</b> for a projector, or download <b>Excel</b>.</p>" },
  { part: "The end", title: "That is the whole PD", page: "prio", hash: "", text: "<p>Part 1: the all-staff slides. Part 2: choose, review and agree our depth standards, from Grade 12 down.</p><p>Leave the walk-through to start for real, or press Back to look again.</p>" }
];
const F = document.getElementById("frame"); let i = 0, loaded = "";
function fit() { const st = document.getElementById("stage"), w = st.clientWidth, h = st.clientHeight, s = Math.min(w / 1440, h / 900); F.style.transform = `scale(${s})`; F.style.left = (w - 1440 * s) / 2 + "px"; F.style.top = (h - 900 * s) / 2 + "px"; }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function ready(test) { for (let k = 0; k < 80; k++) { try { if (test()) return true; } catch (e) { /* not yet */ } await wait(100); } return false; }
async function show(n) {
  i = Math.max(0, Math.min(STEPS.length - 1, n)); const st = STEPS[i];
  document.getElementById("part").textContent = st.part; document.getElementById("title").textContent = st.title; document.getElementById("txt").innerHTML = st.text;
  document.getElementById("count").textContent = `Step ${i + 1} of ${STEPS.length}`; document.getElementById("bar").style.width = ((i + 1) / STEPS.length) * 100 + "%";
  document.getElementById("back").disabled = i === 0; document.getElementById("next").textContent = i === STEPS.length - 1 ? "Start again" : "Next";
  if (st.page === "journey") {
    if (loaded !== "journey") { loaded = "journey"; F.src = "journey.html#staff"; await ready(() => F.contentWindow.eval("slides().length") > 3); await wait(400); }
    const W = F.contentWindow; W.eval(`(() => { const ss = slides(); let k = 0; ss.forEach((s, j) => { if (${JSON.stringify(st.slide)} === 0 ? j === 0 : s.el.id === ${JSON.stringify(st.slide)}) k = j; }); showStep(k); })()`);
  } else {
    if (loaded !== "prio") { loaded = "prio"; F.src = PRIO + "#" + st.hash; await ready(() => F.contentWindow.document.querySelector("#app .panel")); }
    else if (F.contentWindow.location.hash.slice(1) !== st.hash) F.contentWindow.location.hash = st.hash;
    await wait(500); const d = F.contentWindow.document;
    d.querySelectorAll(".tour-ring").forEach((e) => e.classList.remove("tour-ring"));
    if (!d.getElementById("tourcss")) { const s = d.createElement("style"); s.id = "tourcss"; s.textContent = ".tour-ring{outline:4px solid #ED9200!important;outline-offset:6px;border-radius:16px}"; d.head.appendChild(s); }
    if (st.ring) { const el = d.querySelector(st.ring); if (el) { el.classList.add("tour-ring"); el.scrollIntoView({ block: "center" }); } }
  }
}
document.getElementById("next").onclick = () => show(i === STEPS.length - 1 ? 0 : i + 1);
document.getElementById("back").onclick = () => show(i - 1);
let last = 0;
addEventListener("keydown", (e) => { if (e.repeat) return; const now = Date.now(); if (now - last < 200) return;
  if (["PageDown", "ArrowRight", "ArrowDown", " ", "Enter", "n", "N"].includes(e.key) && !e.target.closest("a")) { last = now; e.preventDefault(); show(i === STEPS.length - 1 ? 0 : i + 1); }
  else if (["PageUp", "ArrowLeft", "ArrowUp", "p", "P"].includes(e.key)) { last = now; e.preventDefault(); show(i - 1); } });
addEventListener("resize", fit); fit(); show(0);
/* inside the Google Site frame: a link to open the walk-through in its own tab, for presenting */
try { if (window.self !== window.top) document.getElementById("full").hidden = false; } catch (e) { document.getElementById("full").hidden = false; }
</script>
</body>
</html>
